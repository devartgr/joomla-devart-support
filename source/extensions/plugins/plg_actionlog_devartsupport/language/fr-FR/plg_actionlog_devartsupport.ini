PLG_ACTIONLOG_DEVARTSUPPORT="Action Log - DevArt Support"
PLG_ACTIONLOG_DEVARTSUPPORT_XML_DESCRIPTION="Enregistre les actions des tickets DevArt Support dans le journal d'actions Joomla."
PLG_ACTIONLOG_DEVARTSUPPORT_TYPE_TICKET="ticket"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_CREATED="L'utilisateur <a href="{accountlink}">{username}</a> a créé le ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_UPDATED="L'utilisateur <a href="{accountlink}">{username}</a> a mis à jour le ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_REPLIED="L'utilisateur <a href="{accountlink}">{username}</a> a répondu au ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_STATUS="L'utilisateur <a href="{accountlink}">{username}</a> a changé le statut du ticket <a href="{itemlink}">#{id}</a> en {status}"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_CLOSED="L'utilisateur <a href="{accountlink}">{username}</a> a fermé le ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_REOPENED="L'utilisateur <a href="{accountlink}">{username}</a> a rouvert le ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_PRIORITY="L'utilisateur <a href="{accountlink}">{username}</a> a défini la priorité du ticket <a href="{itemlink}">#{id}</a> sur {priority}"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_TRASHED="L'utilisateur <a href="{accountlink}">{username}</a> a mis à la corbeille le ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_RESTORED="L'utilisateur <a href="{accountlink}">{username}</a> a restauré le ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_DELETED="L'utilisateur <a href="{accountlink}">{username}</a> a supprimé le ticket #{id} ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_UPLOADED="L'utilisateur <a href="{accountlink}">{username}</a> a téléversé la pièce jointe {filename} sur le ticket <a href="{itemlink}">#{id}</a>"
PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_DELETED="L'utilisateur <a href="{accountlink}">{username}</a> a supprimé la pièce jointe {filename} du ticket <a href="{itemlink}">#{id}</a>"
