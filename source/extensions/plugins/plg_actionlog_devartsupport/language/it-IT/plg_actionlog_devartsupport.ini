PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_UPLOADED="L'utente <a href="{accountlink}">{username}</a> ha caricato l'allegato {filename} sul ticket <a href="{itemlink}">#{id}</a>"
PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_DELETED="L'utente <a href="{accountlink}">{username}</a> ha eliminato l'allegato {filename} dal ticket <a href="{itemlink}">#{id}</a>"
