PLG_ACTIONLOG_DEVARTSUPPORT="Action Log - DevArt Support"
PLG_ACTIONLOG_DEVARTSUPPORT_XML_DESCRIPTION="Registra le azioni dei ticket DevArt Support nel registro azioni di Joomla."
PLG_ACTIONLOG_DEVARTSUPPORT_TYPE_TICKET="ticket"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_CREATED="L'utente <a href="{accountlink}">{username}</a> ha creato il ticket <a href="{itemlink}">#{id}</a> ({title})"
