PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_RESTORED="El usuario <a href="{accountlink}">{username}</a> restauró el ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_DELETED="El usuario <a href="{accountlink}">{username}</a> eliminó el ticket #{id} ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_UPLOADED="El usuario <a href="{accountlink}">{username}</a> subió el adjunto {filename} al ticket <a href="{itemlink}">#{id}</a>"
PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_DELETED="El usuario <a href="{accountlink}">{username}</a> eliminó el adjunto {filename} del ticket <a href="{itemlink}">#{id}</a>"
