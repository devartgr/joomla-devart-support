PLG_ACTIONLOG_DEVARTSUPPORT="Action Log - DevArt Support"
PLG_ACTIONLOG_DEVARTSUPPORT_XML_DESCRIPTION="Registra las acciones de tickets de DevArt Support en el registro de acciones de Joomla."
PLG_ACTIONLOG_DEVARTSUPPORT_TYPE_TICKET="ticket"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_CREATED="El usuario <a href="{accountlink}">{username}</a> creó el ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_UPDATED="El usuario <a href="{accountlink}">{username}</a> actualizó el ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_REPLIED="El usuario <a href="{accountlink}">{username}</a> respondió al ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_STATUS="El usuario <a href="{accountlink}">{username}</a> cambió el estado del ticket <a href="{itemlink}">#{id}</a> a {status}"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_CLOSED="El usuario <a href="{accountlink}">{username}</a> cerró el ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_REOPENED="El usuario <a href="{accountlink}">{username}</a> reabrió el ticket <a href="{itemlink}">#{id}</a> ({title})"
