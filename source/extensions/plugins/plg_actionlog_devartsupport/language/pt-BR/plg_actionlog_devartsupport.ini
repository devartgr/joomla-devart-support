PLG_ACTIONLOG_DEVARTSUPPORT="Action Log - DevArt Support"
PLG_ACTIONLOG_DEVARTSUPPORT_XML_DESCRIPTION="Registra ações de tickets do DevArt Support no registro de ações do Joomla."
PLG_ACTIONLOG_DEVARTSUPPORT_TYPE_TICKET="ticket"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_CREATED="O usuário <a href="{accountlink}">{username}</a> criou o ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_UPDATED="O usuário <a href="{accountlink}">{username}</a> atualizou o ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_REPLIED="O usuário <a href="{accountlink}">{username}</a> respondeu ao ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_STATUS="O usuário <a href="{accountlink}">{username}</a> alterou o status do ticket <a href="{itemlink}">#{id}</a> para {status}"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_CLOSED="O usuário <a href="{accountlink}">{username}</a> fechou o ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_REOPENED="O usuário <a href="{accountlink}">{username}</a> reabriu o ticket <a href="{itemlink}">#{id}</a> ({title})"
