PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_RESTORED="O usuário <a href="{accountlink}">{username}</a> restaurou o ticket <a href="{itemlink}">#{id}</a> ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_TICKET_DELETED="O usuário <a href="{accountlink}">{username}</a> excluiu o ticket #{id} ({title})"
PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_UPLOADED="O usuário <a href="{accountlink}">{username}</a> enviou o anexo {filename} no ticket <a href="{itemlink}">#{id}</a>"
PLG_ACTIONLOG_DEVARTSUPPORT_ATTACHMENT_DELETED="O usuário <a href="{accountlink}">{username}</a> excluiu o anexo {filename} do ticket <a href="{itemlink}">#{id}</a>"
